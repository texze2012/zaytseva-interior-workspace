server {
    listen 80;
    server_name 91.132.163.44;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-zaytseva;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://91.132.163.44$request_uri;
    }
}

server {
    # IP clients need the default TLS certificate because they may omit SNI.
    # Existing named HTTPS virtual hosts remain selected by their own SNI.
    listen 443 ssl default_server;
    server_name 91.132.163.44;

    ssl_certificate /etc/letsencrypt-zaytseva/live/zaytseva-interior-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-zaytseva/live/zaytseva-interior-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:ZaytsevaSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 30M;

    location /api/ {
        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
